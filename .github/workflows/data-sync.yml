name: Data Sync

on:
  schedule:
    - cron: '0 6 * * *' # Daily at 6:00 UTC
  workflow_dispatch:
    inputs:
      force:
        description: 'Force reprocess all documents (ignore .completed)'
        type: boolean
        default: false
      limit:
        description: 'Max documents to process (0 = all)'
        type: string
        default: '0'

concurrency:
  group: data-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: write
      id-token: write # Workload Identity Federation → Vertex AI (no stored Google key)

    env:
      GIT_LFS_SKIP_SMUDGE: 1

    steps:
      - name: Checkout (LFS pointers only)
        uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Configure Git LFS credentials
        env:
          LFS_USERNAME: ${{ vars.GIT_LFS_USERNAME }}
          LFS_PASSWORD: ${{ secrets.GIT_LFS_PASSWORD }}
        run: |
          git lfs install
          git config lfs.url "https://${LFS_USERNAME}:${LFS_PASSWORD}@git-lfs.nordstemmen-ai.levinkeller.de"
          git config lfs.https://git-lfs.nordstemmen-ai.levinkeller.de.locksverify false

      - name: Run scraper
        env:
          OPARL_PROXY_URL: https://nordstemmen.ratsinfomanagement.levinkeller.de
          OPARL_PROXY_SECRET: ${{ secrets.OPARL_PROXY_SECRET }}
        run: npm run scrape
        working-directory: scraper

      - name: Download PDFs that still need processing
        id: pending
        # Checkout has LFS pointers only and the pipeline skips pointer files, so PDFs that failed
        # in an earlier run (committed, but no .completed) must be pulled to be retried.
        run: |
          find documents -name '*.pdf' -print0 | while IFS= read -r -d '' f; do
            [ -f "${f%.pdf}.completed" ] || echo "$f"
          done > "$RUNNER_TEMP/pending.txt"
          PENDING=$(wc -l < "$RUNNER_TEMP/pending.txt")
          echo "pending=$PENDING" >> "$GITHUB_OUTPUT"
          echo "$PENDING PDFs without .completed"
          if [ "$PENDING" -gt 0 ]; then
            # LFS include patterns are comma-separated globs: replace commas/glob chars with '?'
            INCLUDE=$(sed 's/[][,*?]/?/g' "$RUNNER_TEMP/pending.txt" | paste -sd, -)
            git lfs pull --include="$INCLUDE" --exclude=""
          fi

      - name: Check for new documents
        id: check
        run: |
          NEW_FILES=$(( $(git status documents/ --porcelain | wc -l) + ${{ steps.pending.outputs.pending }} ))
          echo "new_files=$NEW_FILES" >> "$GITHUB_OUTPUT"
          FORCE="${{ inputs.force || 'false' }}"
          echo "force=$FORCE" >> "$GITHUB_OUTPUT"
          if [ "$NEW_FILES" -eq 0 ] && [ "$FORCE" != "true" ]; then
            echo "No new documents found. Nothing to do."
          else
            echo "Found $NEW_FILES new/changed files in documents/"
          fi

      - name: Authenticate to Google Cloud
        if: steps.check.outputs.new_files != '0' || steps.check.outputs.force == 'true'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/491104209036/locations/global/workloadIdentityPools/github/providers/nordstemmen-ai
          service_account: nordstemmen-pipeline@gen-lang-client-0654772712.iam.gserviceaccount.com

      - name: Run pipeline
        if: steps.check.outputs.new_files != '0' || steps.check.outputs.force == 'true'
        env:
          GOOGLE_CLOUD_PROJECT: gen-lang-client-0654772712
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
          QDRANT_URL: ${{ vars.QDRANT_URL }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
          QDRANT_PORT: '443'
        run: |
          ARGS=""
          if [ "${{ inputs.force || 'false' }}" = "true" ]; then
            ARGS="$ARGS --force"
          fi
          LIMIT="${{ inputs.limit || '0' }}"
          if [ "$LIMIT" != "0" ]; then
            ARGS="$ARGS --limit $LIMIT"
          fi
          npm run pipeline -- $ARGS

      - name: Commit and push new data
        # Runs even if the pipeline failed for some files, so scraped data and finished files are kept
        if: ${{ !cancelled() && (steps.check.outputs.new_files != '0' || steps.check.outputs.force == 'true') }}
        run: |
          git add documents/
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "data: sync new documents from OParl API" || echo "Nothing to commit"
          git pull --rebase origin main
          git push
